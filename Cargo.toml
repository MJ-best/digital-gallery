[workspace]
resolver = "2"
members = [
    "crates/gallery-core",
    "crates/gallery-media",
    "crates/gallery-export",
    "crates/gallery-cli",
    "crates/gallery-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
kamadak-exif = "0.5"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
base64 = "0.22"
walkdir = "2"
tera = "1"
clap = { version = "4", features = ["derive"] }
